[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cattle-breed"
version = "0.1.0"
description = "CS4045 project: cattle breed classification with transfer learning and cross-dataset evaluation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "pillow>=10",
    "imagehash>=4.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# TensorFlow is preinstalled on Colab; install this extra only on machines without it.
train = ["tensorflow>=2.16"]
demo = ["gradio>=4"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
